[workspace]
resolver = "3"
members = [
    "crates/paddock",
    "crates/paddock-bundle",
    "crates/paddock-fixture-chaos",
    "crates/paddock-fixture-echo",
    "crates/paddock-fixture-services",
    "crates/paddock-host",
    "crates/paddock-manifest",
]
# Throwaway spike code is its own workspace with its own lock file; the
# conventions and Definition of Done below do not apply to it.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
# wasmtime 49 declares rust-version 1.96.0, so that is the floor.
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
repository = "https://github.com/jrobhoward/paddock"

# Versions pinned by spike S3 (docs/PHASE1_PLAN.md). The wasmtime crates are
# released together and move as a group.
[workspace.dependencies]
wasmtime = { version = "49", default-features = false }
wasmtime-wasi = { version = "49", default-features = false }
wasmtime-wasi-config = "49"
wit-bindgen = "0.62"
# Same wit-parser line as wit-bindgen 0.62, so the graph carries one copy.
wit-parser = "0.259"
# Same wasmparser line as wit-parser and wasmtime 49, so the graph carries one
# copy.
wasmparser = { version = "0.259", default-features = false, features = ["component-model", "std"] }
tokio = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ciborium = "0.2"
redb = "3"
semver = { version = "1", features = ["serde"] }
toml = "0.9"

paddock-manifest = { path = "crates/paddock-manifest" }
# TEMPORARY: a sibling checkout of rustbridge on its `bundle-1.2` branch, which
# adds bundle format 1.2 (wasm32-wasip2 components, manifest extensions,
# trusted-key verification). Swap for a git or crates.io dependency once that
# branch is published; until then CI cannot build this workspace.
rustbridge-bundle = { path = "../rustbridge/crates/rustbridge-bundle" }

# Test-only
minisign = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
proptest = "1"
rstest = "0.26"
tempfile = "3"
wat = "1.259"
# Same major as rustbridge-bundle's, so tests add no second copy.
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
# A builder whose result is dropped configures nothing, and a `Result`-returning
# public method has to say which errors it means.
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
# Every `unsafe` block states why it is sound.
undocumented_unsafe_blocks = "warn"
# The host is async end to end; a lock held across `.await` stalls a worker
# that other instances are scheduled on.
await_holding_lock = "deny"
