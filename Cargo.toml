[workspace]
resolver = "3"
members = [
    "crates/paddock",
    "crates/paddock-bundle",
    "crates/paddock-fixture-chaos",
    "crates/paddock-fixture-conn",
    "crates/paddock-fixture-counter",
    "crates/paddock-fixture-echo",
    "crates/paddock-fixture-http",
    "crates/paddock-fixture-native",
    "crates/paddock-fixture-net",
    "crates/paddock-fixture-plugin",
    "crates/paddock-fixture-sdk",
    "crates/paddock-fixture-services",
    "crates/paddock-fixture-workload",
    "crates/paddock-host",
    "crates/paddock-modbus",
    "crates/paddock-native",
    "crates/paddock-sdk",
    "crates/paddock-sdk-macros",
    "crates/paddock-soak",
    "crates/paddock-workload",
    "examples/board",
    "examples/counter",
    "examples/ping-pong",
    "examples/chaos",
    "examples/greeter/app",
    "examples/greeter/node",
    "examples/greeter/service",
    "examples/http-counter",
    "examples/ledger",
    "examples/line-server",
    "examples/scada/control",
    "examples/scada/hmi",
    "examples/scada/points",
    "examples/tally",
]
# Throwaway spike code is its own workspace with its own lock file; the
# conventions and Definition of Done below do not apply to it.
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# The current stable rustc: dependencies resolve to their newest releases
# (resolver 3 picks versions that build on rust-version). wasmtime 50 needs 1.97.0.
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
repository = "https://github.com/jrobhoward/paddock"

# Versions pinned by spike S3 (spikes/S3-wasi-target.md). The wasmtime crates are
# released together and move as a group.
[workspace.dependencies]
wasmtime = { version = "50", default-features = false }
wasmtime-wasi = { version = "50", default-features = false }
wasmtime-wasi-config = "50"
# HTTP egress: our own sender, so no default-send-request
# (webpki-roots) and no p3.
wasmtime-wasi-http = { version = "50", default-features = false, features = ["p2"] }
wit-bindgen = "0.63"
# The SDK's HTTP client (`paddock_sdk::http_client`): wasi:http bindings.
wasip2 = "2"
# wit-parser and wasmparser on wasmtime 50's line, so host builds carry one
# copy. wit-bindgen 0.63's macro is a line ahead (0.262); that copy is built
# only for the guests' proc-macro.
wit-parser = "0.261"
wasmparser = { version = "0.261", default-features = false, features = ["component-model", "std"] }
# 1.54: the current line (`AsyncFd::register`, which the serial tty uses, is 1.53.3 on).
tokio = "1.54"
# MIT OR Apache-2.0. Client (polling) and server (serving registers) over TCP.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "tcp-server"] }
thiserror = "2"
tracing = "0.1"
# Apache-2.0 OR MIT; already in the graph (h2). The instance's kill flag
# wakes its task with one.
atomic-waker = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ciborium = "0.2"
# The same line as ciborium: its low-level decoder, for reading one field of
# a CBOR map without decoding the rest (hash routing).
ciborium-ll = "0.2"
redb = "4"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls-native-certs = "0.8"
tower-service = "0.3"
# TLS for the HTTP ingress, on ring (Apache-2.0 AND ISC) rather than aws-lc-rs,
# which needs cmake and carries an OpenSSL-style licence.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# QUIC between nodes, on rustls with ring.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Parses peers' raw public keys (rustls' own verifier crate).
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
base64 = "0.23"
# SQL datasources: Postgres, pooled, TLS on rustls with ring.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
futures-util = { version = "0.3", default-features = false }
tokio-postgres-rustls = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
http-body-util = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
anyhow = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
semver = { version = "1", features = ["serde"] }
toml = "1"

paddock = { path = "crates/paddock", default-features = false }
paddock-bundle = { path = "crates/paddock-bundle" }
# Without the HTTP ingress; `paddock` enables `http` and `tls` by feature.
paddock-host = { path = "crates/paddock-host", default-features = false }
paddock-modbus = { path = "crates/paddock-modbus" }
paddock-native = { path = "crates/paddock-native", default-features = false }
paddock-sdk = { path = "crates/paddock-sdk" }
paddock-sdk-macros = { path = "crates/paddock-sdk-macros" }
paddock-workload = { path = "crates/paddock-workload" }
# rustbridge's `experiment/wasm` branch adds bundle format 1.2 (wasm32-wasip2
# components, manifest extensions, trusted-key verification, signed file
# checksums). Cargo.lock pins the commit. Move to a crates.io release once one
# includes format 1.2.
rustbridge-bundle = { git = "https://github.com/jrobhoward/rustbridge", branch = "experiment/wasm" }
# Loads a rustbridge plugin in paddock-runner (paddock-native).
rustbridge-consumer = { git = "https://github.com/jrobhoward/rustbridge", branch = "experiment/wasm" }
# A rustbridge plugin, for paddock-fixture-plugin.
rustbridge = { git = "https://github.com/jrobhoward/rustbridge", branch = "experiment/wasm" }
# USDT probes (paddock-host's `probes` feature). Pre-release; Cargo.lock pins
# the commit of `main`. Move to a crates.io release once there is one.
anyprobe = { git = "https://github.com/jrobhoward/anyprobe", branch = "main", default-features = false }
# Signs bundles (`paddock bundle`) and test fixtures; same major as
# rustbridge-bundle's, so bundles verify with one copy.
minisign = "0.10"

# Test-only
# Ordinary app code for the `app_cost` benchmark (paddock-workload).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt", "env-filter", "ansi", "json"] }
proptest = "1"
rstest = "0.28"
# Safe system calls: the effective uid for the compiled-component cache's
# owner check (paddock-host, unix only).
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tempfile = "3"
wat = "1.259"
# Same major as rustbridge-bundle's, so tests add no second copy.
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
# cargo-fuzz builds with `--cfg fuzzing`; see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
# A builder whose result is dropped configures nothing, and a `Result`-returning
# public method has to say which errors it means.
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
# Every `unsafe` block states why it is sound.
undocumented_unsafe_blocks = "warn"
# The host is async end to end; a lock held across `.await` stalls a worker
# that other instances are scheduled on.
await_holding_lock = "deny"

# Line tables only: backtraces keep file and line, but a debugger sees no
# variables. Measured 2026-10-11 (16-core machine, fresh target, idle) against
# full debug info: test binaries 220 MB instead of 637 MB (8.0 GB in all
# instead of 24.5 GB), peak memory relinking one test 2.2 GB instead of
# 3.6 GB, a full test build 1:25 instead of 1:57. For a debugging session:
# CARGO_PROFILE_DEV_DEBUG=true. The test profile inherits it.
[profile.dev]
debug = "line-tables-only"

# minisign's scrypt key derivation takes about 5 s per key unoptimized, which
# makes debug builds of `paddock bundle` and their tests crawl.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# Tests compile guest components with Cranelift; unoptimized, it takes
# seconds per component, which dominates the distribution and simulation tests.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
