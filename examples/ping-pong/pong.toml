# Bundle with:
#   cargo build -p example-ping-pong --release
#   bulkhead bundle examples/ping-pong/pong.toml target/release/example-ping-pong --key bulkhead.key
[app]
name = "pong"
version = "1.0.0"
description = "Answers typed Ping calls (bulkhead-sdk example)"
license = "MIT OR Apache-2.0"

[appserver]
registered_names = ["pong"]

[appserver.lifecycle]
start_args = { role = "pong" }
