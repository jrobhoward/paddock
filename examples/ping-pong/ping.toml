# Bundle with:
#   cargo build -p example-ping-pong --release
#   bulkhead bundle examples/ping-pong/ping.toml target/release/example-ping-pong --key bulkhead.key
[app]
name = "ping"
version = "1.0.0"
description = "Calls and monitors pong (bulkhead-sdk example)"
license = "MIT OR Apache-2.0"

[[appserver.dependencies]]
app = "pong"
version = "^1"

[appserver.lifecycle]
start_args = { role = "ping" }
