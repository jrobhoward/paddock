# Bundle with:
#   cargo build -p example-counter --release
#   bulkhead bundle examples/counter/bulkhead.toml target/release/example-counter --key bulkhead.key
[app]
name = "counter"
version = "1.0.0"
description = "A stateful counter (bulkhead-sdk example)"
license = "MIT OR Apache-2.0"

[appserver]
registered_names = ["counter"]

[appserver.lifecycle]
start_args = { register = "counter" }

[appserver.upgrade]
mode = "snapshot"
snapshot_version = 1
