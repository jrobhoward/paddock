# Bundle with:
#   cargo build -p example-counter --target wasm32-wasip2 --release --features v3
#   paddock bundle examples/counter/paddock-v3.toml target/wasm32-wasip2/release/example_counter.wasm --key paddock.key
[app]
name = "counter"
version = "3.0.0"
description = "A stateful counter (paddock-sdk example)"
license = "MIT OR Apache-2.0"

[appserver]
registered_names = ["counter"]

[appserver.lifecycle]
start_args = { register = "counter" }

[appserver.upgrade]
mode = "snapshot"
snapshot_version = 3
from_versions = ["^2"]
