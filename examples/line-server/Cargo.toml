[package]
name = "example-line-server"
version.workspace = true
description = "Bulkhead example: a connection handler speaking a line protocol, handing work to the counter app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same handler as a native program (`kind = "native-process"`).
[[bin]]
name = "example-line-server"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true, features = ["connection"] }

[lints]
workspace = true
