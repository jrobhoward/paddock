# A connection handler: the node binds the `lines` listener to an address
# in its config:
#
#   [listeners.lines]
#   address = "127.0.0.1:7070"
#
# Bundle with:
#   cargo build -p example-line-server --release
#   bulkhead bundle examples/line-server/bulkhead.toml target/release/example-line-server --key bulkhead.key
# Deploy the counter example too; `inc` and `get` are forwarded to it. Each
# instance holds many connections.
[app]
name = "line-server"
version = "1.0.0"
description = "A line protocol over TCP (bulkhead-sdk example)"
license = "MIT OR Apache-2.0"

[[appserver.listeners]]
name = "lines"
idle_timeout_ms = 60000
max_connections = 256
