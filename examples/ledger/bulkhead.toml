# Entries in the node's shared `ledger` bucket. On an HA pair, scope the
# bucket to the cluster and every entry is kept on both nodes: a write
# from either node returns once the primary has committed it. Needs, in
# node config (on both nodes of a pair):
#
#   [buckets.ledger]
#   durability = "disk"
#   scope = "cluster"          # on a pair with [failover] arbiter "witness"
#
# and in policy:
#
#   [apps.ledger]
#   grant = ["bulkhead:keyvalue"]
#   buckets = ["ledger"]
#
# Bundle with:
#   cargo build -p example-ledger --release
#   bulkhead bundle examples/ledger/bulkhead.toml target/release/example-ledger --key bulkhead.key
# then `bulkhead call ledger "put a 1"`, `bulkhead call ledger "get a"`.
[app]
name = "ledger"
version = "1.0.0"
description = "Entries in a shared bucket, replicated on an HA pair (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.capabilities."bulkhead:keyvalue".shared]
ledger = "rw"
