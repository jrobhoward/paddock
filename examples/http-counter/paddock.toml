# A counter over HTTP. The node's ingress sends each request on the
# routes below to this app as a call. Needs, in node config:
#
#   [http.main]
#   address = "127.0.0.1:8080"
#
# and the operator's grant: grant = ["wasi:http/incoming-handler"].
#
# Bundle with:
#   cargo build -p example-http-counter --target wasm32-wasip2 --release
#   paddock bundle examples/http-counter/paddock.toml target/wasm32-wasip2/release/example_http_counter.wasm --key paddock.key
#
# Then: curl localhost:8080/counter ; curl -X POST localhost:8080/counter
[app]
name = "http-counter"
version = "1.0.0"
description = "A counter served over HTTP (paddock-sdk example)"
license = "MIT OR Apache-2.0"

[appserver.capabilities."wasi:http/incoming-handler"]
routes = [{ path_prefix = "/counter" }]
max_body = "4KiB"
timeout_ms = 5000
