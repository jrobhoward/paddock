# bulkhead-priv's configuration (OPERATIONS.md, "The privileged helper").
# Owned by root, mode 0600: the helper refuses a file others may write.
# Every check the helper makes comes from here, never from the node.

node = /usr/local/bin/bulkhead
node_args = node --config /etc/bulkhead/node.toml
node_uid = 990                  # the node's user and group, as numbers (id -u bulkhead)
node_gid = 990
runner = /usr/local/libexec/bulkhead/bulkhead-runner
uids = 60000-60999              # one user per app, from here; never the node's
state = /var/lib/bulkhead-priv  # which user each app has; root's, 0700
binds = /var/lib/bulkhead, /srv/bulkhead   # data_dir and volumes: an instance's directories must be under one
memory_max = 8GiB               # the most a manifest's memory_max may be
pids_max = 4096                 # the most [native] pids_max may be
ports = 80, 443                 # ports below 1024 the node may have bound (ROADMAP PS3b)
# Linux only:
cgroup = /sys/fs/cgroup/system.slice/bulkhead.service   # the service's cgroup (Delegate=yes)
tmp_size = 16MiB                # each instance's private /tmp
#devfs_ruleset = 4290           # FreeBSD: the devfs ruleset the helper defines for its jails
