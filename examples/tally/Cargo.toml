[package]
name = "example-tally"
version.workspace = true
description = "Bulkhead example: a tally kept in Postgres through bulkhead:sql, served over HTTP"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program (`kind = "native-process"`).
[[bin]]
name = "example-tally"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true, features = ["http", "sql"] }
serde_json = { workspace = true }

[lints]
workspace = true
