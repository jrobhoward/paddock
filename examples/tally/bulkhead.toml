# A tally kept in Postgres (`bulkhead:sql`), over HTTP. Needs, in node
# config, an HTTP ingress and the datasource:
#
#   [http.main]
#   address = "127.0.0.1:8080"
#
#   [datasources.main]
#   host = "/run/postgresql"     # or an address; see docs/MANIFEST.md
#   dbname = "tally"
#   user = "tally"
#
# and in policy:
#
#   [apps.tally]
#   grant = ["bulkhead:http-routes", "bulkhead:sql", "bulkhead:logging"]
#   datasources = ["main"]
#
# examples/tutorial (chapter 4) runs it on an HA pair.
[app]
name = "tally"
version = "1.0.0"
description = "A tally kept in Postgres, over HTTP (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.capabilities."bulkhead:http-routes"]
routes = [{ path_prefix = "/tally" }]
max_body = "1KiB"
timeout_ms = 10000

[appserver.capabilities."bulkhead:sql".datasources.main]
max_connections = 2

[appserver.capabilities."bulkhead:logging"]
