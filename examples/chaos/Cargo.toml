[package]
name = "example-chaos"
version.workspace = true
description = "Bulkhead example: an app that fails on purpose, for the Phase 1 failure tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program (`kind = "native-process"`).
[[bin]]
name = "example-chaos"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
