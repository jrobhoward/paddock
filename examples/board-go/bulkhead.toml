# The Go build of examples/board/bulkhead.toml (examples/board-go, on the Go SDK):
# the same app and manifest, plus the wasi:filesystem declaration TinyGo
# needs. What follows is that file's note.
#
# A counter on the bulletin board: the node's shared `board` bucket, on
# disk. Needs, in node config:
#
#   [http.main]
#   address = "127.0.0.1:8080"
#
#   [buckets.board]
#   durability = "disk"
#
# and in policy:
#
#   [apps.board]
#   grant = ["wasi:http/incoming-handler", "wasi:keyvalue", "wasi:logging"]
#   buckets = ["board"]
#
# examples/tutorial walks through it (BOARD=go for this build).
[app]
name = "board"
version = "1.0.0"
description = "A counter on a shared disk bucket, over HTTP (bulkhead example, Go)"
license = "MIT OR Apache-2.0"

[appserver.capabilities."wasi:http/incoming-handler"]
routes = [{ path_prefix = "/board" }]
max_body = "1KiB"
timeout_ms = 5000

[appserver.capabilities."wasi:keyvalue".shared]
board = "rw"

# The component imports process groups for its hot-standby mode
# (hot-standby.toml); declared without groups here, it is never called.
[appserver.capabilities."bulkhead:groups"]

[appserver.capabilities."wasi:logging"]

# TinyGo's runtime imports wasi:filesystem even though the board opens no
# file, and a bundle must declare what its component imports. Declared with
# no preopens and not granted, the node links deny stubs.
[appserver.capabilities."wasi:filesystem"]
