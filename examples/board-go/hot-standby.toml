# The Go build of examples/board/hot-standby.toml (examples/board-go, on the Go SDK):
# the same app and manifest, plus the wasi:filesystem declaration TinyGo
# needs. What follows is that file's note.
#
# The board as a hot standby (tutorial chapter 3): runs on both nodes of an
# HA pair, and the primary writes each count to the standby's board before
# it answers. Needs, on each node of the pair, what bulkhead.toml needs, and
# in policy `bulkhead:groups` granted too:
#
#   [apps.board]
#   grant = ["wasi:http/incoming-handler", "wasi:keyvalue", "wasi:logging", "bulkhead:groups"]
#   buckets = ["board"]
[app]
name = "board"
version = "1.0.0"
description = "A counter on a shared disk bucket, kept on both nodes of an HA pair (bulkhead example, Go)"
license = "MIT OR Apache-2.0"

[appserver.lifecycle]
start_args = { replicate = true }

[appserver.placement]
mode = "hot-standby"

[appserver.capabilities."wasi:http/incoming-handler"]
routes = [{ path_prefix = "/board" }]
max_body = "1KiB"
timeout_ms = 5000

[appserver.capabilities."wasi:keyvalue".shared]
board = "rw"

[appserver.capabilities."bulkhead:groups"]
join = ["board"]

[appserver.capabilities."wasi:logging"]

# TinyGo's runtime imports wasi:filesystem even though the board opens no
# file, and a bundle must declare what its component imports. Declared with
# no preopens and not granted, the node links deny stubs.
[appserver.capabilities."wasi:filesystem"]
