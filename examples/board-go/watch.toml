# The Go build of examples/board/watch.toml (examples/board-go, on the Go SDK):
# the same app and manifest, plus the wasi:filesystem declaration TinyGo
# needs. What follows is that file's note.
#
# Watches the counter on the bulletin board and logs every change
# (`paddock logs board-watch`). The same component as `board`, started with
# {"watch": true}. Needs the `board` bucket in node config (see
# paddock.toml) and in policy:
#
#   [apps.board-watch]
#   grant = ["wasi:keyvalue", "wasi:logging"]
#   buckets = ["board"]
[app]
name = "board-watch"
version = "1.0.0"
description = "Logs every change to the board's counter (paddock example, Go)"
license = "MIT OR Apache-2.0"

[appserver.lifecycle]
start_args = { watch = true }

[appserver.capabilities."wasi:keyvalue".shared]
board = "ro"

# The component imports process groups for its hot-standby mode
# (hot-standby.toml); declared without groups here, it is never called.
[appserver.capabilities."paddock:groups"]

[appserver.capabilities."wasi:logging"]

# TinyGo's runtime imports wasi:filesystem even though the board opens no
# file, and a bundle must declare what its component imports. Declared with
# no preopens and not granted, the node links deny stubs.
[appserver.capabilities."wasi:filesystem"]
