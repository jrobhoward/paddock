# A counter on the bulletin board: the node's shared `board` bucket, on
# disk. Needs, in node config:
#
#   [http.main]
#   address = "127.0.0.1:8080"
#
#   [buckets.board]
#   durability = "disk"
#
# and in policy:
#
#   [apps.board]
#   grant = ["bulkhead:http-routes", "bulkhead:keyvalue", "bulkhead:logging"]
#   buckets = ["board"]
#
# examples/tutorial walks through it. Bundle `target/release/example-board`
# from `cargo build -p example-board --release`.
[app]
name = "board"
version = "1.0.0"
description = "A counter on a shared disk bucket, over HTTP (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.capabilities."bulkhead:http-routes"]
routes = [{ path_prefix = "/board" }]
max_body = "1KiB"
timeout_ms = 5000

[appserver.capabilities."bulkhead:keyvalue".shared]
board = "rw"

# The app joins process groups in its hot-standby mode
# (hot-standby.toml); declared without groups here, it is never called.
[appserver.capabilities."bulkhead:groups"]

[appserver.capabilities."bulkhead:logging"]
