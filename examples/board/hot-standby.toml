# The board as a hot standby (tutorial chapter 3): runs on both nodes of an
# HA pair, and the primary writes each count to the standby's board before
# it answers. Needs, on each node of the pair, what bulkhead.toml needs, and
# in policy `bulkhead:groups` granted too:
#
#   [apps.board]
#   grant = ["bulkhead:http-routes", "bulkhead:keyvalue", "bulkhead:logging", "bulkhead:groups"]
#   buckets = ["board"]
[app]
name = "board"
version = "1.0.0"
description = "A counter on a shared disk bucket, kept on both nodes of an HA pair (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.lifecycle]
start_args = { replicate = true }

[appserver.placement]
mode = "hot-standby"

[appserver.capabilities."bulkhead:http-routes"]
routes = [{ path_prefix = "/board" }]
max_body = "1KiB"
timeout_ms = 5000

[appserver.capabilities."bulkhead:keyvalue".shared]
board = "rw"

[appserver.capabilities."bulkhead:groups"]
join = ["board"]

[appserver.capabilities."bulkhead:logging"]
