# Watches the counter on the bulletin board and logs every change
# (`bulkhead logs board-watch`). The same program as `board`, started with
# {"watch": true}. Needs the `board` bucket in node config (see
# bulkhead.toml) and in policy:
#
#   [apps.board-watch]
#   grant = ["wasi:keyvalue", "wasi:logging"]
#   buckets = ["board"]
[app]
name = "board-watch"
version = "1.0.0"
description = "Logs every change to the board's counter (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.lifecycle]
start_args = { watch = true }

[appserver.capabilities."wasi:keyvalue".shared]
board = "ro"

# The app joins process groups in its hot-standby mode
# (hot-standby.toml); declared without groups here, it is never called.
[appserver.capabilities."bulkhead:groups"]

[appserver.capabilities."wasi:logging"]
