[package]
name = "example-scada-control"
version.workspace = true
description = "Bulkhead example: SCADA alarms, operator writes and an event log, as a singleton"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program (`kind = "native-process"`).
[[bin]]
name = "example-scada-control"
path = "src/main.rs"
required-features = ["native"]

# v1 by default; `v2` counts how often each alarm was raised and migrates
# v1 snapshots.
[features]
native = []
v2 = []

[dependencies]
bulkhead-modbus-client = { workspace = true }
bulkhead-sdk = { workspace = true, features = ["config", "http", "keyvalue", "watch"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
