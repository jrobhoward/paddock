# The operator's view of the point table over HTTP, on every node. Needs
# `[http]` and the `points` bucket in node config (see
# ../points/paddock.toml), and in policy:
#
#   [apps.hmi]
#   grant = ["wasi:http/incoming-handler", "wasi:keyvalue", "wasi:logging"]
#   buckets = ["points"]
[app]
name = "hmi"
version = "1.0.0"
description = "Serves the point table over HTTP, with long polls (paddock example)"
license = "MIT OR Apache-2.0"

[appserver.instances]
count = 2

[appserver.capabilities."wasi:http/incoming-handler"]
routes = [{ path_prefix = "/scada/points" }]
max_body = "1KiB"
timeout_ms = 30000

[appserver.capabilities."wasi:keyvalue".shared]
points = "ro"

[appserver.capabilities."wasi:logging"]
