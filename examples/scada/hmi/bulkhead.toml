# The operator's view of the point table over HTTP, on every node. Needs
# `[http]` and the `points` bucket in node config (see
# ../points/bulkhead.toml), and in policy:
#
#   [apps.hmi]
#   grant = ["bulkhead:http-routes", "bulkhead:keyvalue", "bulkhead:logging"]
#   buckets = ["points"]
[app]
name = "hmi"
version = "1.0.0"
description = "Serves the point table over HTTP, with long polls (bulkhead example)"
license = "MIT OR Apache-2.0"

[appserver.instances]
count = 2

[appserver.capabilities."bulkhead:http-routes"]
routes = [{ path_prefix = "/scada/points" }]
max_body = "1KiB"
timeout_ms = 30000

[appserver.capabilities."bulkhead:keyvalue".shared]
points = "ro"

[appserver.capabilities."bulkhead:logging"]
