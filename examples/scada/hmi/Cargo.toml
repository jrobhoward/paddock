[package]
name = "example-scada-hmi"
version.workspace = true
description = "Bulkhead example: the point table over HTTP, with long polls"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program (`kind = "native-process"`).
[[bin]]
name = "example-scada-hmi"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true, features = ["http", "keyvalue", "watch"] }
serde = { workspace = true }

[lints]
workspace = true
