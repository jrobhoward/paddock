    Delay = 1
    MaxEpoch = 3
    QueueLen = 1
    MaxFaults = 0
    EchoLease = TRUE
    ConfirmOnSend = TRUE
    PersistEpoch = TRUE
    ForgetRenewals = TRUE
    LanFaults = TRUE
    SerialFaults = TRUE
    WanFaults = TRUE
    Crashes = TRUE
    WitnessCrashes = TRUE
    Holds = FALSE
    OperatorConfirms = TRUE
    SerialLost = FALSE
    MaxSwitchovers = 1
    FastHandover = TRUE
    ReleaseClears = TRUE

CONSTRAINT EpochBound
INVARIANT AtMostOneRunning
INVARIANT AtMostOnePrimaryPerEpoch
INVARIANT NoFastHandover
