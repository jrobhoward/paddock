name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mondays 06:00 UTC: drives `fresh-deps`, and re-runs `deny` so an advisory
  # published against an unchanged dependency still turns the build red.
  schedule:
    - cron: "0 6 * * 1"

# The jobs only read the repository; the token can do nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Windows runners default to PowerShell; bash is present on all of them and
# keeps every `run:` block identical.
defaults:
  run:
    shell: bash

jobs:
  # The host touches per-OS behaviour (sockets, filesystem preopens,
  # address-space limits, the serial tty layer), so each OS apps build on
  # runs the whole suite, and Linux on arm64 too (the Raspberry Pi 5 and
  # other arm64 nodes).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The tests build the apps they run (into target/fixtures) on first use.
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # Each step is one check in scripts/check.sh, the same command as
      # locally. Clippy's `-- -Dwarnings` applies to workspace members only,
      # never to dependencies, so a new warning upstream cannot break CI.
      - name: Clippy
        run: scripts/check.sh clippy

      - name: Build every target
        run: scripts/check.sh build

      - name: CLI without the node
        run: scripts/check.sh cli-no-node

      - name: Node without optional features
        run: scripts/check.sh features

      - name: Test
        run: scripts/check.sh test

  # Apps are programs for Unix (the SDK's protocol runs over its sockets and
  # shared memory), so Windows builds only the operator's side: the CLI, the
  # node and the bundle tools, which must stay free of warnings there.
  windows:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Clippy
        run: cargo clippy -p bulkhead -p bulkhead-host -p bulkhead-bundle --locked -- -Dwarnings

  # Guards `rust-version = "1.99.0"`, the stable rustc the dependencies resolve for.
  msrv:
    name: msrv 1.99.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-

      - name: Check
        run: scripts/check.sh msrv

  # Every other job runs `--locked`, so nothing tests against newer
  # dependencies. This job resolves fresh in the runner (never committed) and
  # runs the suite. Scheduled or manual only, so it never blocks a PR; a
  # failure is a notification that an upstream release broke the build, and the
  # fix is a deliberate lock-file update. Uncached on purpose.
  fresh-deps:
    name: fresh deps
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      # `resolver = "3"` is MSRV-aware, so this won't pull dependencies that
      # need a newer rustc than `rust-version`.
      - name: Update dependencies
        run: cargo update

      - name: Show what moved
        run: git --no-pager diff --stat -- Cargo.lock

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Test
        run: cargo test --workspace --all-features

  # Supply chain, against the committed lock file: advisories and the
  # permissive-only licence allow-list in `deny.toml`. Runs on every event so a
  # PR adding a copyleft or vulnerable dependency is blocked at review, and on
  # the weekly schedule so a new advisory is noticed without a commit.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny
        run: scripts/check.sh deny

  lint:
    name: fmt, docs, conventions
    runs-on: ubuntu-latest
    steps:
      # The whole history, so `changelog` finds the merge base with the PR's
      # base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format
        run: scripts/check.sh fmt

      # Catches broken intra-doc links, which `cargo build` does not.
      - name: Docs
        run: scripts/check.sh doc

      # Test names, test file layout and headers.
      - name: Conventions
        run: scripts/check.sh conventions

      - name: Secrets and personal data
        run: scripts/check.sh secrets

      - name: Changelog
        if: github.event_name == 'pull_request'
        run: scripts/check.sh changelog --base origin/${{ github.base_ref }}
