[package]
name = "s13-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
wasmtime = { version = "50", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std", "pooling-allocator"] }
wasmtime-wasi = { version = "50", features = ["p2"] }
