[package]
name = "s10-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
