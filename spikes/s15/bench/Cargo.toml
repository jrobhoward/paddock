[package]
name = "s15-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
paddock-host = { path = "../../../crates/paddock-host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
wasmtime = { version = "49", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std", "pooling-allocator"] }
wasmtime-wasi = { version = "49", features = ["p2"] }
wasmtime-wasi-http = "49"
