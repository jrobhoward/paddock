[package]
name = "bulkhead-fixture-net"
version.workspace = true
description = "Test fixture: an app using wasi:sockets and bulkhead:io through bulkhead-sdk's net module"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program, for `tests/sockets.rs`'s native cases.
[[bin]]
name = "bulkhead-fixture-net"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true, features = ["net"] }

# Natively, UDP goes through the node's requests.
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
bulkhead-native = { workspace = true, features = ["app"] }

[lints]
workspace = true
