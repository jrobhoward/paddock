[package]
name = "paddock-node"
version = "0.0.0"
description = "Paddock node daemon: node config, deploy store, admin API and audit log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "paddock-node"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
paddock-api = { workspace = true }
paddock-bundle = { workspace = true }
paddock-host = { workspace = true }
paddock-manifest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
minisign = { workspace = true }
rustbridge-bundle = { workspace = true }
semver = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
