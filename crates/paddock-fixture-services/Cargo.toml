[package]
name = "paddock-fixture-services"
version = "0.0.0"
description = "Test fixture: an app that drives Paddock's host services"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# `denied`: import and call `paddock:fixture/denied`, an interface no host
# implements, for deny-stub tests. Without it the component does not import
# that interface, so a node accepts it.
[features]
denied = []

[dependencies]
wit-bindgen = { workspace = true }

[lints]
workspace = true
