[package]
name = "bulkhead-native"
version.workspace = true
description = "Native-process apps for Bulkhead: the frame protocol, the app API and bulkhead-runner"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["runner"]
# `bulkhead_native::channel`: the shared-memory rings between a node and
# an app (Linux).
channel = ["dep:rustix", "rustix/fs", "rustix/mm", "rustix/thread", "rustix/pipe", "rustix/net", "rustix/time"]
# `bulkhead_native::app`: a native app as an executable (Unix; it serves
# a node on Linux only).
app = ["channel", "dep:rustix", "rustix/stdio"]
# `bulkhead-runner`, the launcher a node runs native apps through (Linux).
runner = [
    "app",
    "dep:landlock",
    "dep:seccompiler",
    "dep:libc",
    "dep:rustbridge-consumer",
    "dep:serde_json",
    "rustix/event",
]

[[bin]]
name = "bulkhead-runner"
path = "src/bin/bulkhead-runner.rs"
required-features = ["runner"]

[dependencies]
ciborium.workspace = true
serde.workspace = true
rustix = { workspace = true, optional = true }
rustbridge-consumer = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The runner's sandbox, which is Linux only (`runner` is compiled out elsewhere).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.7", optional = true }
seccompiler = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true

[lints]
workspace = true
