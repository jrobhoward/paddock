[package]
name = "bulkhead-sdk"
version.workspace = true
description = "Write Bulkhead apps in Rust: the App trait, process context, typed envelopes and snapshots"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# `bulkhead_sdk::config`: the app's configuration (`bulkhead:config`).
config = []
# `bulkhead_sdk::kv`: keyvalue buckets (`bulkhead:keyvalue`).
keyvalue = []
# `bulkhead_sdk::connection`: connection handlers.
connection = []
# `bulkhead_sdk::groups`: process groups and publish (`bulkhead:groups`).
groups = []
# `bulkhead_sdk::http`: HTTP requests from the node's ingress, as calls.
http = []
# `bulkhead_sdk::http_client`: HTTP requests from the app
# (`bulkhead:http-egress`).
http-client = []
# `bulkhead_sdk::net`: TCP from the app (`bulkhead:sockets`), with readiness as
# messages (`bulkhead:io`).
net = []
# `bulkhead_sdk::secrets`: secrets the operator binds (`bulkhead:secrets`).
secrets = []
# `bulkhead_sdk::metrics`: counters, gauges and histograms (`bulkhead:metrics`).
metrics = []
# `bulkhead_sdk::sql`: SQL datasources the node binds (`bulkhead:sql`).
sql = []
# `bulkhead_sdk::watch`: revisions, compare-and-swap and watches on keyvalue
# buckets (`bulkhead:watch`, under the `bulkhead:keyvalue` capability).
watch = []

[dependencies]
ciborium = { workspace = true }
bulkhead-native = { workspace = true, features = ["app"] }
bulkhead-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
