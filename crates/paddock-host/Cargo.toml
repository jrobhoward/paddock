[package]
name = "paddock-host"
version = "0.0.0"
description = "Paddock host runtime: engine, instances, mailboxes and the callback loop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# USDT probes on the message path (`src/probe.rs`): SystemTap SDT on Linux,
# DTrace on macOS and FreeBSD, ETW on Windows. Without it the probe calls
# compile to nothing.
probes = ["dep:anyprobe"]

[dependencies]
anyprobe = { workspace = true, optional = true }
ciborium = { workspace = true }
paddock-bundle = { workspace = true }
redb = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
tracing = { workspace = true }
wasmtime = { workspace = true, features = ["component-model", "async", "cranelift", "runtime", "std", "pooling-allocator"] }
wasmtime-wasi = { workspace = true, features = ["p2"] }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
wat = { workspace = true }
tracing-subscriber = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
