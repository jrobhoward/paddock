[package]
name = "paddock-soak"
version = "0.0.0"
description = "Long-running fault injection for Paddock: failover between node processes behind UDP proxies, and a chaos app on a node (scripts/soak.sh)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
paddock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
