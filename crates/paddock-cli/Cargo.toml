[package]
name = "paddock-cli"
version = "0.0.0"
description = "The paddock command: manage a Paddock node through its admin API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "paddock"
path = "src/main.rs"
# Same output path as the `paddock` library's docs (cargo#6313); the CLI's
# documentation is its --help.
doc = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
paddock-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }

[dev-dependencies]
minisign = { workspace = true }
paddock-node = { workspace = true }
rustbridge-bundle = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }

[lints]
workspace = true
