[package]
name = "paddock-sdk"
version = "0.0.0"
description = "Write Paddock apps in Rust: the App trait, process context, typed envelopes and snapshots"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# `paddock_sdk::config`: the app's configuration (`wasi:config`).
config = []
# `paddock_sdk::kv`: keyvalue buckets (`wasi:keyvalue`).
keyvalue = []
# `paddock_sdk::connection`: connection handlers (`paddock:connection`).
connection = []
# `paddock_sdk::groups`: process groups and publish (`paddock:groups`).
groups = []
# `paddock_sdk::http`: HTTP requests from the node's ingress, as calls.
http = []
# `paddock_sdk::http_client`: HTTP requests from the app
# (`wasi:http/outgoing-handler`).
http-client = ["dep:wasip2"]
# `paddock_sdk::secrets`: secrets the operator binds (`paddock:secrets`).
secrets = []
# `paddock_sdk::metrics`: counters, gauges and histograms (`paddock:metrics`).
metrics = []
# `paddock_sdk::sql`: SQL datasources the node binds (`paddock:sql`).
sql = []
# `paddock_sdk::watch`: revisions, compare-and-swap and watches on keyvalue
# buckets (`paddock:watch`, under the `wasi:keyvalue` capability).
watch = []

[dependencies]
ciborium = { workspace = true }
paddock-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
wasip2 = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
