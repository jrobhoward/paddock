[package]
name = "paddock"
version = "0.0.0"
description = "Clustered WebAssembly application server with OTP-style supervision: the paddock command, node daemon and admin API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "paddock"
path = "src/main.rs"
# Same output path as the library's docs (cargo#6313); the command's
# documentation is its --help.
doc = false

[features]
default = ["node", "http", "tls", "sql", "probes"]
# The node daemon (`paddock node`) and everything it runs on, wasmtime
# included. Without it, the CLI and bundle tooling only. Alone, a node with
# no optional capability: no HTTP ingress, no probes, no Modbus.
node = [
    "dep:paddock-host",
    "dep:tracing",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/sync",
    "tokio/time",
]
# The node's HTTP ingress (`[http.<name>]` in node config, apps' routes).
http = ["node", "paddock-host/http"]
# HTTPS on the HTTP ingress, and the remote admin API (`[admin]`) with its
# client (`paddock --remote`).
tls = ["http", "paddock-host/tls", "dep:tokio-rustls"]
# SQL datasources (`[datasources.<name>]` in node config, `paddock:sql`):
# Postgres pools, idle until an app calls one.
sql = ["node", "paddock-host/sql"]
# USDT probes on the message path (docs/OBSERVABILITY.md).
probes = ["node", "paddock-host/probes"]
# The Modbus TCP extension (`paddock-modbus:modbus`) in `paddock node`. Off
# by default: a network server with no authentication of its own.
modbus = ["node", "dep:paddock-modbus"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
minisign = { workspace = true }
paddock-bundle = { workspace = true }
paddock-host = { workspace = true, optional = true }
paddock-modbus = { workspace = true, optional = true }
rustbridge-bundle = { workspace = true }
rustyline = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "fs", "time", "signal"] }
toml = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
rcgen = { workspace = true }
rstest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }
tokio-modbus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
wat = { workspace = true }
wit-parser = { workspace = true }

[[example]]
name = "admin_latency"
required-features = ["node"]

[[test]]
name = "cli"
required-features = ["node"]

[[test]]
name = "examples"
required-features = ["node"]

[[test]]
name = "exit_criteria"
required-features = ["node"]

[[test]]
name = "node"
required-features = ["node"]

[[test]]
name = "remote_admin"
required-features = ["tls"]

[[test]]
name = "listeners"
required-features = ["node"]

[[test]]
name = "http"
required-features = ["tls"]

[[test]]
name = "cluster"
required-features = ["node"]

[[test]]
name = "board"
required-features = ["http"]

[[test]]
name = "tally"
required-features = ["http", "sql"]

[[test]]
name = "failover"
required-features = ["node"]

[[test]]
name = "scada"
required-features = ["modbus"]

[lints]
workspace = true
