[package]
name = "paddock-modbus"
version.workspace = true
description = "Paddock extension: Modbus TCP polling and serving, delivering point updates to apps"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
ciborium = { workspace = true }
paddock-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros"] }
tokio-modbus = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
paddock-bundle = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
