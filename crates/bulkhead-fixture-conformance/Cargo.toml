[package]
name = "bulkhead-fixture-conformance"
version.workspace = true
description = "Test fixture: the Rust SDK's app for the conformance suite every guest SDK runs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same app as a native program, for the conformance suite's native
# mode (`BULKHEAD_CONFORMANCE_NATIVE=1`).
[[bin]]
name = "bulkhead-fixture-conformance"
path = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bulkhead-sdk = { workspace = true, features = ["config", "groups", "keyvalue", "metrics", "secrets", "watch"] }
serde = { workspace = true }

[lints]
workspace = true
