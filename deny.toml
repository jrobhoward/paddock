# cargo-deny policy for paddock.
#
# This file exists to answer one question on every build:
#   Is every dependency under a permissive (non-copyleft) licence?
#
# Paddock is MIT OR Apache-2.0 and is meant to be embedded and redistributed,
# so nothing in the dependency graph may impose reciprocal source-disclosure
# obligations on it or on its users.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
# Optional dependencies still count: a user who enables a feature gets its
# graph too, so all features must be evaluated.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
# Advisories consciously accepted, each with a rationale and a link. Empty is
# the goal; an entry here is a decision, not a snooze button.
ignore = []

[licenses]
# Permissive only. Every licence below imposes no reciprocal source-disclosure
# obligation on downstream users of paddock.
#
# Absent on purpose, and the reason this is an allow-list:
#   - MPL-2.0        weak/file-level copyleft
#   - LGPL-*         copyleft with linking obligations
#   - GPL-*, AGPL-*  strong copyleft
#   - CDDL-*, EPL-*, SSPL-*, BUSL-*
#
# If a dependency ever needs one of these, that is a decision to take
# explicitly, in a change that edits this list and says why.
allow = [
    "MIT",
    "Apache-2.0",
    # wasmtime, cranelift, wasm-tools, wit-bindgen, rustix and cap-std. The
    # LLVM exception only relaxes Apache-2.0's attribution terms for binaries.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Required by `unicode-ident` and the ICU crates (via `url`/`idna`), whose
    # expression is `(MIT OR Apache-2.0) AND Unicode-3.0`. A permissive data
    # licence.
    "Unicode-3.0",
    # `foldhash` (via hashbrown) is Zlib-only.
    "Zlib",
]
# Not allowed, and not needed: `bzip2-1.0.6` (libbz2-rs-sys) and
# `CC0-1.0`/`MIT-0` (ppmd-rust) come with the `zip` crate's default codecs.
# rustbridge-bundle builds zip with Deflate only (rustbridge `bundle-1.2`), so
# neither is in the graph.
confidence-threshold = 0.93
# Some entries cover crates only certain targets or features pull in.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies without a version are fine inside an unpublished
# workspace; cargo strips dev-dependencies at publish.
allow-wildcard-paths = true
# Crates whose licences or behaviour are incompatible with paddock, listed by
# name so an accidental `cargo add` fails loudly. Empty until one is found.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rustbridge's bundle format 1.2 is on its `experiment/wasm` branch until a
# crates.io release includes it (Cargo.lock pins the commit).
allow-git = [
    "https://github.com/jrobhoward/rustbridge",
    "https://github.com/jrobhoward/anyprobe",
]
